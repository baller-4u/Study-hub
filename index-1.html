<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>StudyHub</title>
<style>
:root{--bg:#f3f8fc;--card:#fff;--tx:#1d3347;--mu:#5d7488;--bl:#3b82c4;--bd:#e0ebf3;--gr:#8fd9a8;--gt:#12462a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a24;--card:#17283a;--tx:#e6f0f8;--mu:#93a9bb;--bl:#5a9fdc;--bd:#243b50;--gr:#6cc58a;--gt:#08301a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
header{background:var(--bl);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:17px}.m{color:var(--mu);font-size:13px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0}
.r{display:flex;gap:6px}.r>*{flex:1}button,.b{background:var(--gr);color:var(--gt);border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.b2{background:transparent;color:var(--bl);border:1px solid var(--bl)}.x{background:none;color:var(--mu);padding:2px 8px}
.i{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex}
nav a{flex:1;text-align:center;padding:8px 2px;font-size:11px;color:var(--mu);cursor:pointer}nav a.on{color:var(--bl);font-weight:700}nav a span{display:block;font-size:19px}
.msg{background:var(--bg);border-radius:10px;padding:6px 10px;margin:4px 0}.big{font-size:30px;font-weight:700;color:var(--bl)}iframe{width:100%;border:0;border-radius:12px;margin-top:8px}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://ydnrajmpiyzlbcmyqxwq.supabase.co','sb_publishable_jMNWCvSeqdZSRm-wpKYhZg_D89sjv9a');
const v=i=>(document.getElementById(i)||{}).value||'',E=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let people=[],mats=[],qs=[],T=null,dms=[],qi=null,dch=null,U=null,me={},courses=[],enr=[],tt=[],goals=[],ev=[],sess=[],msgs=[],P='home',G=null,ch=null,mode='in',err='',cg=[{u:3,g:5}],res=null,emb={y:'',s:''};
const NAV=[['home','🏠','Home'],['plan','🗓️','Plan'],['cgpa','🎓','CGPA'],['lib','📚','Library'],['con','💬','Groups'],['live','🎥','Live'],['med','🎧','Media']];
const go=p=>{P=p;R()};
async function load(){const u=U.id;const q=await Promise.all([sb.from('profiles').select('*').eq('id',u).single(),sb.from('courses').select('*').order('code'),sb.from('enrollments').select('course_id').eq('user_id',u),sb.from('schedule').select('*').eq('user_id',u),sb.from('goals').select('*').eq('user_id',u).order('id'),sb.from('events').select('*').order('event_date'),sb.from('sessions').select('*').order('start_time'),sb.from('profiles').select('id,full_name,matric_no').neq('id',u),sb.from('materials').select('*').eq('user_id',u).order('id',{ascending:false}),sb.from('questions').select('*').eq('user_id',u).order('id')]);
me=q[0].data||{};courses=q[1].data||[];enr=(q[2].data||[]).map(x=>x.course_id);tt=q[3].data||[];goals=q[4].data||[];ev=q[5].data||[];sess=q[6].data||[];people=q[7].data||[];mats=q[8].data||[];qs=q[9].data||[];if(!dch)dch=sb.channel('dm').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'receiver_id=eq.'+U.id},()=>loadDms()).subscribe();R()}
async function loadMsgs(){if(!G)return;const{data}=await sb.from('messages').select('content,created_at,profiles!sender_id(full_name)').eq('course_id',G).order('created_at').limit(100);msgs=data||[];if(P=='con')R()}
function sub(){if(ch)sb.removeChannel(ch);ch=G?sb.channel('m'+G).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'course_id=eq.'+G},loadMsgs).subscribe():null}
const run=async f=>{try{await f();await load()}catch(e){alert(e.message||e)}};
async function auth(){err='';const em=v('em'),pw=v('pw');let r;
if(mode=='up')r=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:v('n'),matric_no:v('mt')}}});else r=await sb.auth.signInWithPassword({email:em,password:pw});
if(r.error){err=r.error.message;return R()}if(r.data.session){U=r.data.user;load()}else{err='Check your email to confirm, then log in.';R()}}
const V={
home(){const d=D[new Date().getDay()],t=tt.filter(x=>x.day==d).sort((a,b)=>a.start_time>b.start_time?1:-1);
return`<div class="c"><h2>Welcome, ${E((me.full_name||'').split(' ')[0])} 👋</h2><div class="m">${E(me.matric_no||U.email)}</div></div>
<div class="c"><h2>Today (${d})</h2>${t.map(x=>`<div class="i"><b>${E(x.course_code)} · ${E(x.location)}</b><span class="m">${(x.start_time||'').slice(0,5)}-${(x.end_time||'').slice(0,5)}</span></div>`).join('')||'<span class="m">No classes today.</span>'}</div>
<div class="c"><h2>Notifications</h2>${[...goals.filter(g=>!g.done&&g.due_date&&g.due_date<=new Date(Date.now()+2*864e5).toISOString().slice(0,10)).map(g=>'⏰ Goal due '+g.due_date+': '+g.title),...ev.filter(e=>e.event_date>=new Date().toISOString().slice(0,10)).slice(0,3).map(e=>'📅 '+e.title+' · '+e.event_date)].map(x=>`<div class="i">${E(x)}</div>`).join('')||'<span class="m">All caught up.</span>'}</div>
<div class="c"><h2>My courses</h2>${courses.filter(c=>enr.includes(c.id)).map(c=>`<div class="i">${E(c.code)} <span class="m">${E(c.name)}</span></div>`).join('')||'<span class="m">Join courses in Groups.</span>'}</div>
<button class="b2" onclick="sb.auth.signOut().then(()=>{U=null;R()})">Log out</button>`},
plan(){return`<div class="c"><h2>Timetable</h2><input id="tc" placeholder="Course code"><div class="r"><select id="td">${D.map(x=>`<option>${x}</option>`).join('')}</select><input id="ts" type="time" value="08:00"><input id="te" type="time" value="10:00"></div><input id="tr" placeholder="Venue"><button onclick="run(()=>ins('schedule',{user_id:U.id,course_code:v('tc').toUpperCase(),day:v('td'),start_time:v('ts'),end_time:v('te'),location:v('tr')||'TBA'}))">Add class</button>
${tt.map(x=>`<div class="i"><span><b>${x.day}</b> ${E(x.course_code)} · ${E(x.location)}<br><span class="m">${x.start_time.slice(0,5)}-${x.end_time.slice(0,5)}</span></span><button class="x" onclick="run(()=>del('schedule',${x.id}))">✕</button></div>`).join('')}</div>
<div class="c"><h2>Goals</h2><input id="gt" placeholder="e.g. Finish Macroeconomics Chapter 3"><input id="gd" type="date"><button onclick="run(()=>ins('goals',{user_id:U.id,title:v('gt'),due_date:v('gd')||null}))">Set goal</button>
${goals.map(g=>`<div class="i"><span onclick="run(()=>sb.from('goals').update({done:${!g.done}}).eq('id',${g.id}))" style="cursor:pointer;${g.done?'text-decoration:line-through;opacity:.6':''}">${g.done?'✅':'⬜'} ${E(g.title)}<br><span class="m">${g.due_date||''}</span></span><button class="x" onclick="run(()=>del('goals',${g.id}))">✕</button></div>`).join('')}</div>`},
cgpa(){return`<div class="c"><h2>CGPA calculator</h2><p class="m">5.0 scale: A=5 B=4 C=3 D=2 E=1 F=0</p>${cg.map((x,i)=>`<div class="r"><input type="number" min="1" value="${x.u}" onchange="cg[${i}].u=+this.value"><select onchange="cg[${i}].g=+this.value">${'ABCDEF'.split('').map((l,k)=>`<option value="${5-k}" ${x.g==5-k?'selected':''}>${l}</option>`).join('')}</select><button class="x" onclick="cg.splice(${i},1);R()">✕</button></div>`).join('')}
<button class="b2" onclick="cg.push({u:3,g:5});R()">+ Course (credits, grade)</button><div class="r" style="margin-top:8px"><input id="pc" type="number" placeholder="Previous credits"><input id="pg" type="number" step=".01" placeholder="Previous CGPA"></div><button onclick="calc()">Calculate</button>${res?`<div class="m">Semester GPA</div><div class="big">${res.g}</div><div class="m">CGPA</div><div class="big">${res.c}</div>`:''}</div>`},
con(){return`<div class="c"><h2>Course groups</h2>${courses.map(c=>`<div class="i"><span><b>${E(c.code)}</b> <span class="m">${E(c.name)}</span></span><span>${enr.includes(c.id)?`<button class="b2" onclick="G=${c.id};loadMsgs();sub()">Chat</button> <button class="x" onclick="run(()=>sb.from('enrollments').delete().eq('course_id',${c.id}).eq('user_id',U.id))">Leave</button>`:`<button onclick="run(()=>ins('enrollments',{user_id:U.id,course_id:${c.id}}))">Join</button>`}</span></div>`).join('')}
<input id="nc" placeholder="Add a course code (e.g. ECO201)"><button class="b2" onclick="run(()=>ins('courses',{code:v('nc').toUpperCase(),name:v('nc').toUpperCase()}))">Add course</button></div>
${G?`<div class="c"><h2>${E((courses.find(c=>c.id==G)||{}).code)} chat</h2><div style="max-height:260px;overflow:auto">${msgs.map(m=>`<div class="msg"><b>${E(m.profiles?.full_name||'Student')}</b> <span class="m">${new Date(m.created_at).toTimeString().slice(0,5)}</span><br>${E(m.content)}</div>`).join('')||'<span class="m">No messages yet.</span>'}</div><div class="r"><input id="cm" placeholder="Message classmates" onkeydown="if(event.key=='Enter')send()"><button style="max-width:80px" onclick="send()">Send</button></div></div>`:''}${dmHtml()}`},
lib(){return`<div class="c"><h2>Study materials</h2><input type="file" id="f" accept=".pdf,.txt,.md,.doc,.docx,.png,.jpg"><button onclick="run(upl)">Upload</button><p class="m">Text files get an instant summary. PDF summaries need an AI service (later).</p>${mats.map(m=>`<div style="padding:7px 0;border-bottom:1px solid var(--bd)"><b>📄 ${E(m.name)}</b> <button class="x" onclick="openF('${E(m.path)}')">Open</button><button class="x" onclick="run(()=>delM(${m.id},'${E(m.path)}'))">✕</button><div class="m">${E(m.summary||'')}</div></div>`).join('')||'<span class="m">Nothing uploaded yet.</span>'}</div>
<div class="c"><h2>Self-test</h2><input id="qq" placeholder="Question"><input id="qa" placeholder="Answer"><button onclick="run(()=>ins('questions',{user_id:U.id,question:v('qq'),answer:v('qa')}))">Add question</button> <button class="b2" onclick="qi=qs.length?{s:0,i:0}:null;R()">Start test</button><div class="m">${qs.length} question(s) saved</div>${qi?(qi.i<qs.length?`<div class="msg"><b>Q${qi.i+1}: ${E(qs[qi.i].question)}</b><input id="ua" placeholder="Your answer"><button onclick="chk()">Submit</button></div>`:`<div class="big">Score: ${qi.s}/${qs.length}</div>`):''}${qs.map(q=>`<div class="i"><span class="m">${E(q.question)}</span><button class="x" onclick="run(()=>del('questions',${q.id}))">✕</button></div>`).join('')}</div>`},
live(){return`<div class="c"><h2>Live classes</h2><input id="st" placeholder="Topic"><div class="r"><select id="sc">${courses.map(c=>`<option value="${c.id}">${E(c.code)}</option>`).join('')}</select><input id="sw" type="datetime-local"></div><button onclick="run(()=>{const t=new Date(v('sw')||Date.now());return ins('sessions',{tutor_id:U.id,course_id:+v('sc'),title:v('st'),start_time:t.toISOString(),end_time:new Date(+t+36e5).toISOString(),meeting_link:'https://meet.jit.si/studyhub-'+Math.random().toString(36).slice(2,10)})})">Schedule class</button>
${sess.map(s=>`<div class="i"><span><b>${E(s.title)}</b><br><span class="m">${new Date(s.start_time).toLocaleString()}</span></span><a class="b" target="_blank" href="${E(s.meeting_link)}">Join Room</a></div>`).join('')}</div>
<div class="c"><h2>Campus events</h2><input id="et" placeholder="Seminar, workshop..."><input id="ed" type="date"><button onclick="run(()=>ins('events',{title:v('et'),event_date:v('ed'),created_by:U.id}))">Add event</button>${ev.map(e=>`<div class="i">📅 ${E(e.title)} <span class="m">${e.event_date}</span></div>`).join('')}</div>`},
med(){return`<div class="c"><h2>Study music</h2><input id="sp" placeholder="Paste a Spotify link" value="${E(emb.s)}"><button onclick="emb.s=v('sp');R()">Load</button>${emb.s.includes('open.spotify.com')?`<iframe height="152" src="${E(emb.s.split('?')[0].replace('open.spotify.com/','open.spotify.com/embed/'))}" allow="encrypted-media"></iframe>`:''}</div>
<div class="c"><h2>Educational videos</h2><input id="ys" placeholder="Search YouTube"><button onclick="window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(v('ys')))">Search</button><input id="yl" placeholder="Paste a YouTube link" value="${E(emb.y)}"><button class="b2" onclick="emb.y=v('yl');R()">Watch</button>${(m=>m?`<iframe height="220" src="https://www.youtube.com/embed/${m[1]}" allowfullscreen></iframe>`:'')(emb.y.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/))}</div>`}};
async function ins(t,o){if(!(o.title??o.course_code??o.code??o.course_id??1))return;const{error}=await sb.from(t).insert(o);if(error)throw error}
async function del(t,id){const{error}=await sb.from(t).delete().eq('id',id);if(error)throw error}
async function send(){if(!v('cm'))return;const c=v('cm');document.getElementById('cm').value='';const{error}=await sb.from('messages').insert({course_id:G,sender_id:U.id,content:c});if(error)alert(error.message);else loadMsgs()}
function dmHtml(){return`<div class="c"><h2>Private messages</h2>${T?`<b>${E(T.full_name)}</b> <button class="x" onclick="T=null;R()">close</button><div style="max-height:240px;overflow:auto">${dms.map(m=>`<div class="msg"><b>${m.sender_id==U.id?'You':E(T.full_name)}</b> <span class="m">${new Date(m.created_at).toTimeString().slice(0,5)}</span><br>${E(m.content)}</div>`).join('')||'<span class="m">No messages yet.</span>'}</div><div class="r"><input id="dm" placeholder="Private message" onkeydown="if(event.key=='Enter')sendDm()"><button style="max-width:80px" onclick="sendDm()">Send</button></div>`:people.map(p=>`<div class="i"><span>${E(p.full_name)} <span class="m">${E(p.matric_no||'')}</span></span><button class="b2" onclick="openDm('${p.id}')">Message</button></div>`).join('')||'<span class="m">No other students yet. Invite classmates!</span>'}</div>`}
async function loadDms(){if(!T)return;const{data}=await sb.from('messages').select('content,created_at,sender_id').is('course_id',null).or(`and(sender_id.eq.${U.id},receiver_id.eq.${T.id}),and(sender_id.eq.${T.id},receiver_id.eq.${U.id})`).order('created_at').limit(100);dms=data||[];if(P=='con')R()}
function openDm(id){T=people.find(p=>p.id==id);loadDms();R()}
async function sendDm(){const c=v('dm');if(!c)return;const{error}=await sb.from('messages').insert({sender_id:U.id,receiver_id:T.id,content:c});if(error)alert(error.message);else loadDms()}
async function upl(){const f=document.getElementById('f').files[0];if(!f)throw new Error('Choose a file first');const path=U.id+'/'+Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');const u=await sb.storage.from('materials').upload(path,f);if(u.error)throw u.error;let s='';if(/\.(txt|md)$/i.test(f.name))s=sum(await f.text());await ins('materials',{user_id:U.id,name:f.name,path,summary:s})}
async function openF(p){const{data,error}=await sb.storage.from('materials').createSignedUrl(p,300);if(error)return alert(error.message);window.open(data.signedUrl)}
async function delM(id,p){await sb.storage.from('materials').remove([p]);await del('materials',id)}
function chk(){const q=qs[qi.i],a=v('ua').trim().toLowerCase();if(a&&(q.answer||'').toLowerCase().includes(a))qi.s++;qi.i++;R()}
function sum(t){const s=t.match(/[^.!?\n]+[.!?]/g)||[t.slice(0,200)],w={},k=x=>x.toLowerCase().match(/\b[a-z]{4,}\b/g)||[];k(t).forEach(x=>w[x]=(w[x]||0)+1);return s.map((x,i)=>({x,i,k:k(x).reduce((a,y)=>a+w[y],0)/Math.sqrt(x.length)})).sort((a,b)=>b.k-a.k).slice(0,3).sort((a,b)=>a.i-b.i).map(o=>o.x.trim()).join(' ')}
function calc(){const pc=+v('pc')||0,pg=+v('pg')||0,cu=cg.reduce((a,x)=>a+x.u,0),gp=cg.reduce((a,x)=>a+x.u*x.g,0);if(cu)res={g:(gp/cu).toFixed(2),c:((gp+pc*pg)/(cu+pc)).toFixed(2)};R()}
function R(){const a=document.getElementById('app');if(!U){a.innerHTML=`<main><div class="c" style="margin-top:30px"><h2 style="color:var(--bl);font-size:24px">🎓 StudyHub</h2><p class="m">Learn together with your classmates.</p>${mode=='up'?'<input id="n" placeholder="Full name"><input id="mt" placeholder="Matric number">':''}<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ characters)"><p style="color:#c0392b">${E(err)}</p><button style="width:100%" onclick="auth()">${mode=='up'?'Create account':'Log in'}</button><p class="m" onclick="mode=mode=='up'?'in':'up';err='';R()" style="cursor:pointer;text-align:center">${mode=='up'?'Have an account? Log in':'New here? Sign up'}</p></div></main>`;return}
a.innerHTML=`<header><b>🎓 StudyHub</b></header><main>${V[P]()}</main><nav>${NAV.map(n=>`<a class="${P==n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</a>`).join('')}</nav>`}
sb.auth.getSession().then(({data})=>{if(data.session){U=data.session.user;load()}else R()});
</script></body></html>
