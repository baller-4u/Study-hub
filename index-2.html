async function enc(id,t){const k=await shared(id),iv=crypto.getRandomValues(new Uint8Array(12));return'e2e:'+b64(iv)+':'+b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(t)))}
async function dec(id,t){try{if(!t.startsWith('e2e:'))return t;const[,i,c]=t.split(':');return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(i)},await shared(id),ub(c)))}catch(e){return'🔒 Cannot decrypt (the secure key changed or is on another device)'}}

function sum(t){const s=t.match(/[^.!?\n]+[.!?]/g)||[t.slice(0,200)],w={},k=x=>x.toLowerCase().match(/\b[a-z]{4,}\b/g)||[];k(t).forEach(x=>w[x]=(w[x]||0)+1);return s.map((x,i)=>({x,i,k:k(x).reduce((a,y)=>a+w[y],0)/Math.sqrt(x.length)})).sort((a,b)=>b.k-a.k).slice(0,3).sort((a,b)=>a.i-b.i).map(o=>o.x.trim()).join(' ')}
